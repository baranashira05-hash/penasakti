version: "3.9"

services:
  # ============= PostgreSQL =============
  postgres:
    image: postgres:16-alpine
    container_name: penasakti_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: penasakti
      POSTGRES_USER: penasakti_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strong_password_here}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penasakti_user -d penasakti"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============= Redis =============
  redis:
    image: redis:7-alpine
    container_name: penasakti_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============= Next.js App =============
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: penasakti_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://penasakti_user:${POSTGRES_PASSWORD:-strong_password_here}@postgres:5432/penasakti
      REDIS_URL: redis://redis:6379
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME}
    ports:
      - "3000:3000"
    volumes:
      - ./public/uploads:/app/public/uploads

  # ============= Nginx Reverse Proxy =============
  nginx:
    image: nginx:alpine
    container_name: penasakti_nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./public:/var/www/public:ro

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: penasakti_network
